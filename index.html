<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolf Capital - Secure Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }

body {
    background:#f4f7fb;
    color:#0a2540;
}

header {
    background:linear-gradient(135deg,#0a2540,#1a3d7c);
    color:white;
    padding:30px;
    text-align:center;
}

h2 { margin-bottom:20px; }

.container {
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

input, select {
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

button {
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#635bff;
    border:none;
    color:white;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
}

button:hover { background:#4f46e5; }

.hidden { display:none; }

.dashboard {
    max-width:900px;
    margin:40px auto;
}

.card {
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.admin {
    background:#ffe9e9;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
}

</style>
</head>
<body>

<header>
<h1>Wolf Capital</h1>
<p>Access capital built for growth.</p>
</header>

<!-- LOGIN / REGISTER -->
<div class="container" id="authSection">
<h2>Create / Login Account</h2>
<input type="tel" id="phone" placeholder="Phone Number">
<input type="password" id="password" placeholder="Password">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- OTP VERIFICATION -->
<div class="container hidden" id="otpSection">
<h2>Phone Verification</h2>
<p>Enter the 6-digit OTP sent to your number</p>
<input type="text" id="otpInput" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify</button>
</div>

<!-- APPLICATION SECTION -->
<div class="container hidden" id="applicationSection">
<h2>Loan Application</h2>

<input type="text" id="fullName" placeholder="Full Legal Name">
<input type="text" id="nationalId" placeholder="National ID">
<input type="number" id="loanAmount" placeholder="Loan Amount">
<select id="repayment">
<option value="">Repayment Period</option>
<option>3 Months</option>
<option>6 Months</option>
<option>12 Months</option>
</select>
<input type="number" id="income" placeholder="Monthly Income">

<button onclick="submitApplication()">Submit Application</button>
<button onclick="viewDashboard()">Go to Dashboard</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard hidden" id="dashboardSection">
<h2>Client Dashboard</h2>
<div id="applicationsList"></div>

<div class="admin">
<h3>Admin Access</h3>
<button onclick="viewAllApplications()">View All Applications (Admin)</button>
<div id="adminApplications"></div>
</div>

<button onclick="logout()">Logout</button>
</div>

<script>

// STORAGE STRUCTURE
// users: [{phone, password, verified}]
let users = JSON.parse(localStorage.getItem("users")) || [];
let applications = JSON.parse(localStorage.getItem("applications")) || [];
let currentUser = null;
let generatedOTP = "";

// REGISTER
function register() {
    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;

    if(!phone || !password) return alert("Fill all fields");

    if(users.find(u => u.phone === phone))
        return alert("User already exists");

    generatedOTP = Math.floor(100000 + Math.random() * 900000);
    alert("SIMULATED OTP: " + generatedOTP);

    users.push({phone, password, verified:false});
    localStorage.setItem("users", JSON.stringify(users));

    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("otpSection").classList.remove("hidden");

    currentUser = phone;
}

// LOGIN
function login() {
    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;

    const user = users.find(u => u.phone === phone && u.password === password);
    if(!user) return alert("Invalid credentials");

    if(!user.verified) {
        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        alert("SIMULATED OTP: " + generatedOTP);
        currentUser = phone;
        document.getElementById("authSection").classList.add("hidden");
        document.getElementById("otpSection").classList.remove("hidden");
    } else {
        currentUser = phone;
        showApplication();
    }
}

// VERIFY OTP
function verifyOTP() {
    const entered = document.getElementById("otpInput").value;

    if(entered == generatedOTP) {
        let user = users.find(u => u.phone === currentUser);
        user.verified = true;
        localStorage.setItem("users", JSON.stringify(users));
        showApplication();
    } else {
        alert("Invalid OTP");
    }
}

function showApplication() {
    document.getElementById("otpSection").classList.add("hidden");
    document.getElementById("applicationSection").classList.remove("hidden");
}

// SUBMIT APPLICATION
function submitApplication() {
    const data = {
        phone: currentUser,
        fullName: document.getElementById("fullName").value,
        nationalId: document.getElementById("nationalId").value,
        loanAmount: document.getElementById("loanAmount").value,
        repayment: document.getElementById("repayment").value,
        income: document.getElementById("income").value,
        date: new Date().toLocaleString()
    };

    applications.push(data);
    localStorage.setItem("applications", JSON.stringify(applications));

    alert("Application Submitted Successfully");
}

// VIEW DASHBOARD
function viewDashboard() {
    document.getElementById("applicationSection").classList.add("hidden");
    document.getElementById("dashboardSection").classList.remove("hidden");

    let userApps = applications.filter(a => a.phone === currentUser);
    let list = document.getElementById("applicationsList");
    list.innerHTML = "";

    userApps.forEach(app => {
        list.innerHTML += `
        <div class="card">
        <strong>Name:</strong> ${app.fullName}<br>
        <strong>Loan:</strong> ${app.loanAmount}<br>
        <strong>Status:</strong> Under Review<br>
        <small>${app.date}</small>
        </div>`;
    });
}

// ADMIN VIEW
function viewAllApplications() {
    let adminDiv = document.getElementById("adminApplications");
    adminDiv.innerHTML = "";

    applications.forEach(app => {
        adminDiv.innerHTML += `
        <div class="card">
        ${app.fullName} | ${app.phone} | ${app.loanAmount}
        </div>`;
    });
}

function logout() {
    location.reload();
}

</script>

</body>
</html>
